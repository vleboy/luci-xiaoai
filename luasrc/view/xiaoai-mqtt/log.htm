<%+header%>
<div class="cbi-map">
    <h2><%:XiaoAi MQTT 日志管理%></h2>
    
    <!-- 统计信息 -->
    <div class="cbi-section log-stats">
        <h3><%:日志统计%></h3>
        <div class="stats-grid">
            <div class="stat-item">
                <span class="label"><%:文件大小%>:</span>
                <span class="value" id="log-size">0B</span>
            </div>
            <div class="stat-item">
                <span class="label"><%:日志条目%>:</span>
                <span class="value" id="log-lines">0</span>
            </div>
        </div>
    </div>

    <!-- 日志内容 -->
    <div class="cbi-section log-content">
        <h3><%:实时日志%></h3>
        <pre class="log-output" id="log-output"><%:暂无日志内容...%></pre>
    </div>

    <!-- 操作按钮 -->
    <div class="cbi-section log-actions">
        <div class="cbi-page-actions">
            <form class="inline" method="post" action="<%=url('admin/services/xiaoai-mqtt/clear_log')%>">
                <input type="hidden" name="token" value="<%=token%>" />
                <button type="submit" class="cbi-button cbi-button-reset">
                    🗑️ <%:清空日志%>
                </button>
            </form>
            
            <button class="cbi-button cbi-button-neutral" onclick="refreshLog(); return false;">
                🔄 <%:刷新日志%>
            </button>

            <a class="cbi-button cbi-button-apply" 
               href="<%=url('admin/services/xiaoai-mqtt/download_log')%>">
                ⬇️ <%:下载日志%>
            </a>
        </div>
    </div>
</div>

<link rel="stylesheet" href="<%=resource%>/view/xiaoai-mqtt/style.css">

<script>
// 自动刷新功能（通过 JSON 接口拉取，避免整页刷新）
var autoRefresh = true;

function refreshLog() {
    if (!autoRefresh) return;
    fetch('<%=luci.dispatcher.build_url("admin/services/xiaoai-mqtt/log_data")%>?_=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (data) {
            var out = document.getElementById('log-output');
            if (out && data) {
                out.textContent = data.tail ? data.tail : '<%:暂无日志内容...%>';
                out.scrollTop = out.scrollHeight;
            }
            var sizeEl = document.getElementById('log-size');
            if (sizeEl && data) sizeEl.textContent = data.size;
            var linesEl = document.getElementById('log-lines');
            if (linesEl && data) linesEl.textContent = data.lines;
        })
        .catch(function () { /* 网络错误时静默，下一轮重试 */ });
}

// 每5秒刷新
setInterval(refreshLog, 5000);

// 鼠标悬停时暂停自动刷新
var logOutput = document.getElementById('log-output');
if (logOutput) {
    logOutput.addEventListener('mouseenter', function () { autoRefresh = false; });
    logOutput.addEventListener('mouseleave', function () { autoRefresh = true; });
}

// 初始加载
refreshLog();
</script>

<%+footer%>
